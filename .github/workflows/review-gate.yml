name: Review gate (report only)

# Phase 0 placeholder. Not a required check. Does not read a Verdict, label,
# comment, approve, or merge. A PASS is not a merge right in this repo.
# continue-on-error so the job cannot turn the pull request red.
# A colon-space in a plain `run:` scalar is invalid YAML and GitHub then
# fails the push with 0 jobs. The script stays under a block scalar.
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    name: reviewed tip (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Phase0 report
        run: |
          echo "Phase0 report-only: no Verdict is read. Open, update, and merge stay behind a human yes."
